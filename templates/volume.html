<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>容量の選択 - おすすめ焼酎診断</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h2>どの容量（サイズ）をご希望ですか？</h2>
    
    <div class="options">
      <a class="choice-btn" href="{{ url_for('taste', type=drink_type, volume='100') }}">100ml〜360ml（お試し・カップ）</a>
      <a class="choice-btn" href="{{ url_for('taste', type=drink_type, volume='720') }}">500ml〜900ml（四合瓶 / スリムパック）</a>
      <a class="choice-btn" href="{{ url_for('taste', type=drink_type, volume='1800') }}">1800ml（一升瓶 / 紙パック）</a>
      <a class="choice-btn" href="{{ url_for('taste', type=drink_type, volume='any') }}">こだわらない / すべて</a>
    </div>

    <div style="margin-top: 25px; text-align: center;">
      <a href="{{ url_for('select') }}" style="color: #666; text-decoration: underline; font-size: 0.9rem;">← 種類選択に戻る</a>
    </div>
  </div>
</body>
</html>
