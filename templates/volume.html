<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>容量の選択 - おすすめ焼酎診断</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2>ご希望の容量（サイズ）を選んでください</h2>
    
    <div class="options" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
      <a href="{{ url_for('taste', type=drink_type, volume='100') }}" class="choice-btn">
        100ml〜360ml（お試し・カップ）
      </a>
      <a href="{{ url_for('taste', type=drink_type, volume='720') }}" class="choice-btn">
        500ml〜900ml（四合瓶 / スリムパック）
      </a>
      <a href="{{ url_for('taste', type=drink_type, volume='1800') }}" class="choice-btn">
        1800ml（一升瓶 / 紙パック）
      </a>
      <a href="{{ url_for('taste', type=drink_type, volume='any') }}" class="choice-btn">
        こだわらない / すべて
      </a>
    </div>

    <div style="margin-top: 25px; text-align: center;">
      <a href="{{ url_for('select') }}" class="btn-back">← 種類選択に戻る</a>
    </div>
  </div>
</body>
</html>
